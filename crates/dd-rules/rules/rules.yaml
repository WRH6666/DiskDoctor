- id: cargo-registry-src
  name: Cargo 解压依赖
  why: Rust 依赖解压后的源码，可由缓存重新解压。
  recovery: 重新 cargo build 时自动重建。
  match:
    kind: path-contains
    pattern: '.cargo\registry\src'
  category: package-cache
  safety: safe
  action: delete
