  category: os-update-leftover
  safety: safe
  action: delete
  priority: 86
  unless-below:
    # 注：锚点 &app_context 定义在 J 节，本规则位于其之前无法用别名引用，
    # 故在此写明完整列表。修改语境定义时**记得同步这两处**（见 validate_rules.py 的校验）。
    - '\extensions\'
    - '\resources\app'
    - 'app.asar'
    - '\programs\'
    - '\runtimes\'
    - '\sandbox_runtime'
    - '\site-packages\'
    - '\lib\python'
    - '\lib\node'
    - '\.vscode\'
    - '\.qoder\'
    - '\.cursor\'
    - '\.windsurf\'
    - '\.trae'

