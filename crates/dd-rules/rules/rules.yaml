# DiskDoctor 归因规则库
#
# 求值顺序：按下面的书写顺序自上而下，**首次命中即停止**。
# 因此必须由「具体」到「宽泛」排列，例如 appdata\local\npm-cache 一定要排在 appdata 之前。
# 需要打断顺序时用 priority（数值大的先算）。
#
# safety 取值：
#   safe            可安全回收，删了能自动重建 / 重新下载
#   caution         需要你确认，可能含个人数据
#   keep            用户数据，本工具不主动清理
#   system-managed  系统托管，禁止直接删，只能走官方命令
#   protected       硬黑名单，永不触碰
#
# action 取值：delete / command / compact / review / none

# ===========================================================================
# A. 硬保护：碰了会让系统或软件出问题
# ===========================================================================

- id: windows-winsxs
  name: 组件存储 WinSxS
  why: 用 NTFS 硬链接保存所有系统组件的历史版本，手动删除会导致系统无法启动、更新失败、SFC 失效。它显示的体积有很大一部分是硬链接，并不真实占用。
  recovery: 无需恢复；系统会在后续更新中自行补齐所需组件。
  match:
    kind: path-suffix
    pattern: 'windows\winsxs'
  category: component-store
  safety: system-managed
  action: command
  command: 'Dism.exe /Online /Cleanup-Image /StartComponentCleanup'
  priority: 100

- id: windows-driverstore
  name: 驱动仓库 DriverStore
  why: 保存每个驱动硬件的所有历史版本，用于驱动回滚。手动删除会导致设备无法加载驱动、无法回滚。它的体积同样包含大量硬链接。
  recovery: 无法恢复。清理旧驱动请用 pnputil 逐条确认，不建议批量操作。
  match:
    kind: path-suffix
    pattern: 'windows\system32\driverstore'
  category: driver-store
  safety: system-managed
  action: review
  priority: 100

- id: windows-installer
  name: MSI 安装缓存
  why: 保存已安装程序的原始安装包，卸载和「修复」时要用。删掉会导致很多软件无法卸载或修复，且卸载列表会残留。
  recovery: 无法恢复，只能重装对应软件。
  match:
    kind: path-suffix
    pattern: 'windows\installer'
  category: app-data
  safety: protected
  action: none
  priority: 100

- id: windows-system32
  name: 系统核心目录
  why: 操作系统本体。
  recovery: 只能重装系统。
  match:
    kind: path-suffix
    pattern: 'windows\system32'
  category: app-data
  safety: protected
  action: none
  priority: 99

- id: windows-syswow64
  name: 32 位兼容层
  why: 运行 32 位程序所需的系统组件。
  recovery: 只能重装系统。
  match:
    kind: path-suffix
    pattern: 'windows\syswow64'
  category: app-data
  safety: protected
  action: none
  priority: 99

- id: windows-boot
  name: 启动相关文件
  why: 引导管理器与启动配置，删除后系统无法启动。
  recovery: 需要用系统安装介质修复引导。
  match:
    kind: path-suffix
    pattern: 'windows\boot'
  category: app-data
  safety: protected
  action: none
  priority: 99

- id: windows-servicing
  name: 系统服务组件
  why: 系统维护与更新机制的核心组件。
  recovery: 只能重装系统。
  match:
    kind: path-suffix
    pattern: 'windows\servicing'
  category: app-data
  safety: protected
  action: none
  priority: 99

- id: windows-assembly
  name: .NET 程序集缓存
  why: .NET 全局程序集缓存，被大量程序依赖。
  recovery: 部分可通过重新安装 .NET 运行库恢复。
  match:
    kind: path-suffix
    pattern: 'windows\assembly'
  category: app-data
  safety: protected
  action: none
  priority: 99

- id: windows-fonts
  name: 系统字体
  why: 系统内置字体，删除会导致界面文字显示异常。
  recovery: 从其他机器或系统镜像中恢复。
  match:
    kind: path-suffix
    pattern: 'windows\fonts'
  category: app-data
  safety: protected
  action: none
  priority: 98

- id: windows-systemapps
  name: 系统应用
  why: 开始菜单、设置、资源管理器等系统内置应用。
  recovery: 只能通过系统修复或重装恢复。
  match:
    kind: path-suffix
    pattern: 'windows\systemapps'
  category: app-data
  safety: protected
  action: none
  priority: 98

- id: windows-inf
  name: 驱动安装信息
  why: 驱动安装所需的 inf 配置文件与安装日志。
  recovery: 需要重新安装对应驱动。
  match:
    kind: path-suffix
    pattern: 'windows\inf'
  category: app-data
  safety: protected
  action: none
  priority: 98

- id: program-files
  name: 已安装程序
  why: 通过安装程序安装的软件本体，直接删除会留下无法清除的注册表残留。
  recovery: 卸载请走「设置 → 应用 → 已安装的应用」。
  match:
    kind: path-suffix
    pattern: 'program files'
  category: app-data
  safety: protected
  action: none
  priority: 95

- id: program-files-x86
  name: 已安装程序（32 位）
  why: 32 位软件本体，同上。
  recovery: 卸载请走「设置 → 应用 → 已安装的应用」。
  match:
    kind: path-suffix
    pattern: 'program files (x86)'
  category: app-data
  safety: protected
  action: none
  priority: 95

- id: windows-windowsapps
  name: 商店应用
  why: 从 Microsoft Store 安装的应用，必须通过系统卸载。
  recovery: 在「已安装的应用」中重新安装。
  match:
    kind: path-suffix
    pattern: 'program files\windowsapps'
  category: app-data
  safety: protected
  action: none
  priority: 96

# ===========================================================================
# B. 系统托管：只能走官方渠道回收
# ===========================================================================

- id: hiberfil
  name: 休眠文件
  why: 系统休眠时把内存内容写到这里，体积约等于物理内存。关掉休眠即可释放，代价是失去「休眠」功能，以及「快速启动」也会一并失效。
  recovery: 执行 powercfg /h on 可恢复，文件会重新生成。
  match:
    kind: name
    pattern: 'hiberfil.sys'
  category: hibernation-file
  safety: system-managed
  action: command
  command: 'powercfg /h off'
  priority: 97

- id: pagefile
  name: 虚拟内存页面文件
  why: 内存不够时系统把数据换到这里。**绝对不能直接删除**，会导致程序崩溃甚至蓝屏。正确做法是把它迁到别的盘，或者设置一个较小的固定值。
  recovery: 系统属性的虚拟内存设置里改回来，或删除后重启由系统自动重建。
  match:
    kind: name
    pattern: 'pagefile.sys'
  category: page-file
  safety: system-managed
  action: review
  priority: 97

- id: swapfile
  name: UWP 交换文件
  why: 供商店应用使用的交换文件，由 system 进程独占，无法手动删除。
  recovery: 系统自动管理，无需干预。
  match:
    kind: name
    pattern: 'swapfile.sys'
  category: page-file
  safety: system-managed
  action: none
  priority: 97

- id: system-volume-information
  name: 系统还原点 / 卷影副本
  why: 由卷影复制服务（VSS）维护的历史快照，用于系统还原和「以前的版本」。是很多人 C 盘莫名少几十 GB 的真正原因，而普通工具根本扫不到它。
  recovery: 删除后无法取回旧快照，但系统会按计划重新创建新的还原点。
  match:
    kind: path-suffix
    pattern: 'system volume information'
  category: shadow-copy
  safety: system-managed
  action: review
  priority: 96

- id: recovery-image
  name: 恢复分区镜像
  why: 系统重置用的恢复镜像。
  recovery: 需要从系统安装介质重建。
  match:
    kind: name-glob
    pattern: 'winre.wim'
  category: app-data
  safety: system-managed
  action: none
  priority: 96

# ===========================================================================
# C. 系统更新残留（可回收）
# ===========================================================================

- id: windows-old
  name: 旧版 Windows 安装
  why: 大版本升级时保留的上一版系统，用于 10 天内回退。放弃回退后即可删除，**通常能一次回收几十 GB**。
  recovery: 删除后无法回退到上一个 Windows 版本。
  match:
    kind: path-suffix
    pattern: 'windows.old'
  category: os-update-leftover
  safety: safe
  action: command
  command: 'cleanmgr.exe /d C:'
  priority: 95

- id: windows-bt
  name: 升级临时文件
  why: 功能更新期间解压的系统文件，升级完成后即为残留。
  recovery: 无需恢复，删除不影响系统运行。
  match:
    kind: name-glob
    pattern: '$windows.~bt'
  category: os-update-leftover
  safety: safe
  action: delete
  priority: 95

- id: windows-ws
  name: 升级暂存文件
  why: 同上，属于升级过程的中间产物。
  recovery: 无需恢复。
  match:
    kind: name-glob
    pattern: '$windows.~ws'
  category: os-update-leftover
  safety: safe
  action: delete
  priority: 95

- id: softwaredistribution-download
  name: Windows 更新下载缓存
  why: 已安装更新的原始下载包，安装完成后不再需要。稳妥做法是先停掉 Windows Update 服务再清空。
  recovery: 无需恢复，后续更新会重新下载。
  match:
    kind: path-suffix
    pattern: 'windows\softwaredistribution\download'
  category: os-update-leftover
  safety: safe
  action: delete
  priority: 94

- id: delivery-optimization
  name: 传递优化缓存
  why: 更新分发用的 P2P 缓存，删掉不影响任何功能。
  recovery: 无需恢复。
  match:
    kind: path-contains
    pattern: 'softwaredistribution\deliveryoptimization'
  category: os-update-leftover
  safety: safe
  action: delete
  priority: 93

- id: windows-esd
  name: 升级镜像暂存
  why: 系统升级时下载的镜像解压目录。
  recovery: 无需恢复。
  match:
    kind: path-suffix
    pattern: 'windows\esd'
  category: os-update-leftover
  safety: caution
  action: delete
  priority: 90

- id: recycle-bin
  name: 回收站
  why: 已删除但尚未真正释放的文件。
  recovery: 清空后无法通过回收站还原。
  match:
    kind: path-suffix
    pattern: '$recycle.bin'
  category: recycle-bin
  safety: safe
  action: command
  command: 'Clear-RecycleBin -Force'
  priority: 90

# ===========================================================================
# D. 开发工具缓存（最大的一类，几乎全部可安全回收）
# ===========================================================================

- id: npm-cache
  name: npm 下载缓存
  why: npm 安装过的包压缩包缓存，删掉只是下次安装时重新下载。
  recovery: 重新执行 npm install 时自动重建。
  match:
    kind: path-suffix
    pattern: 'appdata\local\npm-cache'
  category: package-cache
  safety: safe
  action: command
  command: 'npm cache clean --force'
  priority: 80

- id: npm-cache-roaming
  name: npm 缓存（旧位置）
  why: 老版本 npm 的缓存目录，同样可以安全清除。
  recovery: 自动重建。
  match:
    kind: path-suffix
    pattern: 'appdata\roaming\npm-cache'
  category: package-cache
  safety: safe
  action: delete
  priority: 80

- id: yarn-cache
  name: Yarn 缓存
  why: Yarn 的包缓存，删掉只是重新下载。
  recovery: 重新执行 yarn install 时自动重建。
  match:
    kind: path-suffix
    pattern: 'appdata\local\yarn\cache'
  category: package-cache
  safety: safe
  action: command
  command: 'yarn cache clean'
  priority: 80

- id: yarn-berry-cache
  name: Yarn Berry 缓存
  why: Yarn 2+ 在项目 .yarn 目录下维护的包缓存。
  recovery: 重新执行 yarn install 时自动重建。
  match:
    kind: path-contains
    pattern: '.yarn\cache'
  category: package-cache
  safety: safe
  action: delete
  priority: 78

- id: pnpm-store
  name: pnpm 内容寻址存储
  why: pnpm 用硬链接共享同一份包内容，这里存的就是那些内容。删除后所有 pnpm 项目都需要重新安装依赖。
  recovery: 重新执行 pnpm install 时自动重建。
  match:
    kind: path-contains
    pattern: '\pnpm-store'
  category: package-cache
  safety: safe
  action: command
  command: 'pnpm store prune'
  priority: 80

- id: pip-cache
  name: pip 下载缓存
  why: pip 下载过的 wheel 包缓存。
  recovery: 重新 pip install 时自动重建。
  match:
    kind: path-suffix
    pattern: 'appdata\local\pip\cache'
  category: package-cache
  safety: safe
  action: command
  command: 'pip cache purge'
  priority: 80

- id: uv-cache
  name: uv 下载缓存
  why: uv 包管理器的缓存目录。
  recovery: 重新 uv sync 时自动重建。
  match:
    kind: path-contains
    pattern: 'appdata\local\uv\cache'
  category: package-cache
  safety: safe
  action: command
  command: 'uv cache clean'
  priority: 80

- id: conda-pkgs-anaconda
  name: Conda 包缓存（Anaconda）
  why: Conda 下载的包压缩包，删除不影响已创建的环境。
  recovery: 重新安装包时自动下载。
  match:
    kind: path-contains
    pattern: 'anaconda3\pkgs'
  category: package-cache
  safety: caution
  action: command
  command: 'conda clean --all -y'
  priority: 60

- id: conda-pkgs-miniconda
  name: Conda 包缓存（Miniconda）
  why: Conda 下载的包压缩包，删除不影响已创建的环境。
  recovery: 重新安装包时自动下载。
  match:
    kind: path-contains
    pattern: 'miniconda3\pkgs'
  category: package-cache
  safety: caution
  action: command
  command: 'conda clean --all -y'
  priority: 60

- id: cargo-registry-cache
  name: Cargo 下载缓存
  why: Rust 依赖的 .crate 压缩包缓存。
  recovery: 重新 cargo build 时自动下载。
