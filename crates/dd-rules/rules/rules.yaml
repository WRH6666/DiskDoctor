# ===========================================================================
# K2. 用户根目录下的开发工具链 / 系统文件
#
# 这一批是根据一次真实扫描的「未识别清单」补出来的 —— 它们占了 19 GB，
# 而且其中混着**绝对不能删**的东西（注册表配置单元、代码历史、工具链）。
# 不覆盖它们的后果不是"少识别一点"，而是用户在一堆未识别项里
