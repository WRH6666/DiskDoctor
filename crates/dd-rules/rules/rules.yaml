# ===========================================================================
# E. IDE / 编辑器缓存
# ===========================================================================

- id: ide-extensions
  name: IDE 扩展目录
  why: 编辑器扩展的安装目录。其中的 `node_modules`、`vendor` 之类**不是**
     "可重新生成的构建产物"，而是扩展自带的运行时依赖 —— 删掉会让扩展失效
     （实测过：Python 扩展、Keil 扩展都栽在这上面）。想清理扩展请在编辑器里卸载。
  recovery: 从扩展市场重新安装对应扩展。
  match:
    kind: path-contains
    pattern: '\extensions\'
  category: app-data
  safety: caution
  action: review
  priority: 96

- id: jetbrains-caches
  name: JetBrains IDE 索引缓存
  why: IntelliJ / PyCharm / GoLand 等的索引与缓存，删除后首次打开项目会重建索引（会卡一会儿），但不丢任何配置和代码。
  recovery: 下次打开项目时自动重建索引。
  match:
    kind: path-glob
    pattern: 'appdata\local\jetbrains\*\caches'
  category: ide-cache
  safety: safe
  action: delete
  priority: 82

- id: jetbrains-logs
  name: JetBrains IDE 日志
  why: IDE 运行日志，排查完问题即可清理。
  recovery: 无需恢复。
  match:
    kind: path-glob
    pattern: 'appdata\local\jetbrains\*\log'
  category: log-file
  safety: safe
  action: delete
  priority: 82

- id: vscode-cache
  name: VS Code 缓存
  why: 编辑器缓存、GPU 缓存、网络缓存，删除不影响设置和扩展。
  recovery: 下次启动自动重建。
  match:
    kind: path-glob
    pattern: 'appdata\roaming\code\*cache'
  category: ide-cache
  safety: safe
  action: delete
  priority: 82

- id: vscode-cacheddata
  name: VS Code 编译缓存
  why: 扩展的编译产物缓存。
  recovery: 下次启动自动重建。
  match:
    kind: path-glob
    pattern: 'appdata\roaming\code\cacheddata'
  category: ide-cache
  safety: safe
  action: delete
  priority: 82

- id: vscode-logs
  name: VS Code 日志
