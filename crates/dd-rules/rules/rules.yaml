# ===========================================================================
# J. 构建产物（名字规则，跨项目通用）
#
# ⚠ 这一节的所有规则都带 `unless-below` 语境约束，这是修一个真实事故的结果：
#
#   `C:\Users\me\.vscode\extensions\ms-python.python-xxx\out\client\node_modules`
#   被 `node-modules` 规则判成「可安全回收」—— 而那是 **Python 扩展自带的
#   运行时依赖**，删了扩展直接失效。
#
# 靠调 priority 压不住：那要求每新增一个 IDE / 应用目录，都得记得给它设一个
# 比 68 更高的优先级，迟早会漏。语境约束是加法式的 —— 声明一条"可重建"规则时，
# 顺手说清它在哪些语境下不成立即可，新增 IDE 目录时无需改这些规则。
#
# 约束集用 YAML 锚点定义一次（见下面的 &app_context），后续规则用 *app_context 引用。
# 判断依据：祖先路径里出现任一片段，就说明"这是已安装软件的组成部分，
# 不是用户自己的项目"，此时"删了能重新生成"的假设不成立。
#
# 注意：`.vscode` / `.qoder` / `.cursor` 这些 IDE 数据目录下的 extensions
# 子目录用的是同一个命名约定，所以 `\extensions\` 一条就覆盖了所有 IDE。
# ===========================================================================

- id: node-modules
  name: Node.js 依赖目录
  why: 由 npm / pnpm / yarn 安装生成，**不含任何你自己写的代码**，随时可以重新生成。
  recovery: 在项目目录重新执行 npm install（或 pnpm / yarn install）。
  match:
    kind: name
    pattern: 'node_modules'
  category: build-artifact
  safety: safe
  action: delete
  priority: 68
  unless-below: &app_context
    - '\extensions\'          # IDE 扩展目录（.vscode/.qoder/.cursor/... 通用）
    - '\resources\app'        # Electron 应用资源
    - 'app.asar'              # Electron 打包产物
    - '\programs\'            # 用户级程序安装目录
    - '\runtimes\'            # 捆绑运行时
    - '\sandbox_runtime'      # 沙箱运行时
    - '\site-packages\'       # Python 第三方库
    - '\lib\python'           # 嵌入式 Python
    - '\lib\node'             # 嵌入式 Node
    - '\.vscode\'
    - '\.qoder\'
    - '\.cursor\'
    - '\.windsurf\'
    - '\.trae'

- id: pycache
  name: Python 字节码缓存
  why: Python 解释器自动生成的 .pyc 缓存，删除无任何影响。
  recovery: 下次运行时自动重生成。
  match:
    kind: name
    pattern: '__pycache__'
  category: build-artifact
  safety: safe
  action: delete
  priority: 68
  unless-below: *app_context

- id: pytest-cache
  name: pytest 缓存
  why: 测试框架的缓存目录。
  recovery: 下次跑测试时自动重建。
  match:
