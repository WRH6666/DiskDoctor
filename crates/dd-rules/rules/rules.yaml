# ===========================================================================
# K6. 数据盘（非系统盘）常见内容
#
# 这一批来自对一块真实 D 盘的扫描：1.48M 个文件、525 GB 未被识别。
# 原规则库严重偏向系统盘（AppData / Windows / 开发缓存），一碰到
# 「把软件和资料都装在 D 盘」这种典型用法就直接失效。
#
# **其中有一条是真 bug 的修复**：`D:\Program` 这类自定义软件安装目录
# 原先没有规则，导致它内部的 `node_modules` 被 build-artifact 规则命中，
# 报成「可安全回收」—— 那是 VS Code 自带扩展的依赖，删了会直接破坏
# 已安装的软件。给安装根目录一条高 priority 的保护规则即可：继承机制
# 会让其下所有内容都归到「已安装程序」，优先级 95 > 68 天然胜出。
# ===========================================================================

- id: custom-program-dir
  name: 自定义软件安装目录
  why: 你把软件装在了非默认位置。里面的内容属于已安装程序本体，
     其中像 `node_modules` 这类名字看起来"可重建"的目录其实是软件自带的
     运行时依赖，**删掉会直接让软件无法启动**。
  recovery: 请通过软件自带的卸载程序或「设置 → 应用」卸载。
  match:
    kind: name
    pattern: 'program'
  category: app-data
  safety: protected
  action: none
  priority: 95

- id: user-programs-dir
  name: 用户级程序安装目录
  why: 软件的"仅为我安装"位置（VS Code、Cursor 等默认装在这里）。
     里面的 `node_modules`、`resources\app` 都是程序自带的运行时文件，
     **删掉会让软件打不开**。卸载请走「设置 → 应用」。
  recovery: 需要重新安装。
  match:
    # 必须用 path-contains 而不是 path-suffix —— 这个目录下面全是子目录，
    # path-suffix 只匹配"恰好以它结尾"的路径，等于永远不命中。
    kind: path-contains
    pattern: 'appdata\local\programs'
  category: app-data
  safety: protected
  action: none
  priority: 95

- id: app-runtimes
  name: 应用捆绑运行时
  why: 软件自带的一整套运行时（Node / Python / 浏览器内核等）。
