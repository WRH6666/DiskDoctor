  command: 'dotnet nuget locals all --clear'
  priority: 80

- id: go-mod-cache
  name: Go 模块缓存
  why: Go 下载的模块缓存。
  recovery: 重新 go mod download 时自动下载。
  match:
    kind: path-contains
    pattern: 'go\pkg\mod\cache'
