- id: nuget-packages
  name: NuGet 包缓存
  why: .NET 依赖包缓存。
  recovery: 重新 restore 时自动下载。
  match:
    kind: path-contains
    pattern: '.nuget\packages'
  category: package-cache
  safety: safe
