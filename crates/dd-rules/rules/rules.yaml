     文件关联。**删除会导致无法登录、系统崩溃。**
  recovery: 只能从系统还原点或备份恢复。
  match:
    kind: name-glob
    pattern: 'ntuser.dat*'
  category: app-data
  safety: protected
  action: none
  priority: 99

- id: usrclass-dat
  name: 用户类注册表配置单元
  why: 用户级的 COM 组件与文件类型注册信息，删除会破坏大量软件。
  recovery: 只能从系统还原点或备份恢复。
  match:
    kind: name-glob
    pattern: 'usrclass.dat*'
  category: app-data
  safety: protected
  action: none
  priority: 99

